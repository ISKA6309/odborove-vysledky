<style>:root {
  color-scheme: light;
  --ink: #22312f;
  --muted: #5b6d69;
  --paper: #f4f7fb;
  --white: #fff;
  --surface: #fff;
  --line: #dce4ee;
  --green: #167a62;
  --mint: #e8edf2;
  --pink: #f2e4ee;
  --red: #a43c50;

  --primary-text: #087f78;

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background-color: var(--paper); background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px); background-size: 12px 12px; }
button, input, select, textarea { font: inherit; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
a { color: inherit; }
button, input, select, textarea, summary, a { outline-offset: 4px; }
:focus-visible { outline: 3px solid var(--focus); }
h1, h2, h3, p { margin: 0 0 16px; overflow-wrap: anywhere; }
h1, h2, h3, .big-pin, .countdown, .match-percent { font-family: 'Space Grotesk', sans-serif; font-weight: 600; }
h1 { font-size: 40px; line-height: 1.14; }
h2 { font-size: 25px; line-height: 1.25; }
h3 { font-size: 18px; }
p { line-height: 1.6; }
svg { width: 20px; height: 20px; flex-shrink: 0; vertical-align: middle; }
.icon-fallback { display: inline-grid; place-items: center; width: 20px; height: 20px; flex-shrink: 0; font-size: 20px; line-height: 1; }
.lucide-icon { display: inline-block; width: 20px; height: 20px; flex: 0 0 20px; background-color: currentColor; -webkit-mask: var(--icon-mask) center / contain no-repeat; mask: var(--icon-mask) center / contain no-repeat; }
.btn .lucide-icon { width: 18px; height: 18px; flex-basis: 18px; }

.brand-divider { width: 1px; height: 24px; flex-shrink: 0; background: var(--brand-divider); }
.brand-title { overflow-wrap: anywhere; line-height: 1.3; }
.header-actions { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
.header-status { text-align: right; font-size: 12px; font-weight: 700; }
#connection { display: block; color: var(--red); }
#app { max-width: 1240px; margin: 0 auto; padding: 38px 28px 60px; }
.eyebrow { text-transform: uppercase; font-size: 12px; font-weight: 800; color: var(--primary-text); margin-bottom: 14px; }
.entry > .eyebrow { color: var(--slogan-color); }
.title-dot { color: var(--title-accent); }
.entry { padding-top: 18px; }
.entry > h1 { font-size: 56px; max-width: 650px; margin-bottom: 40px; }
.entry-content { border-top: 1px solid var(--line); padding-top: 32px; }
.player-home { max-width: 560px; margin-inline: auto; }
.presenter-home { max-width: 760px; margin-inline: auto; }
.join-tool { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 30px; max-width: 560px; }
.presenter-entry { padding: 14px 0; }
label { display: block; font-size: 13px; font-weight: 700; margin: 19px 0 8px; }
input:not([type='checkbox']), select, textarea { width: 100%; padding: 12px 14px; min-height: 48px; border-radius: 5px; border: 1px solid var(--input-border); background: var(--surface); color: var(--ink); min-width: 0; }
select { appearance: auto; max-width: 100%; min-height: 44px; height: 44px; padding: 9px 28px 9px 12px; font-family: inherit; font-size: 14px; font-weight: 400; line-height: 1.4; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
select option, select optgroup { font-family: 'DM Sans', 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; background-color: var(--surface); color: var(--ink); }
select optgroup { font-weight: 700; }
@supports (appearance: base-select) {
  select, ::picker(select) { appearance: base-select; }
  select { display: inline-flex; align-items: center; gap: 8px; padding: 9px 12px; }
  select > button { display: flex; flex: 1; align-items: center; min-width: 0; margin: 0; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; text-align: start; cursor: inherit; }
  selectedcontent { display: block; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  select::picker-icon { margin-inline-start: auto; color: var(--muted); font-size: 12px; flex-shrink: 0; }
  select:open { border-color: var(--focus); }
  ::picker(select) {
    box-sizing: border-box;
    inline-size: anchor-size(width);
    min-inline-size: 0;
    max-inline-size: calc(100vw - 24px);
    max-block-size: min(280px, 50dvh);
    margin-block: 4px;
    padding: 4px;
    border: 1px solid var(--input-border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 8px 24px var(--shadow);
    font-family: 'DM Sans', 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.4;
    overflow-y: auto;
    overflow-x: hidden;
  }
  select option { position: relative; display: block; max-inline-size: 100%; min-height: 36px; padding: 8px 28px 8px 10px; border-radius: 3px; line-height: 20px; white-space: normal; overflow-wrap: anywhere; }
  select option:checked, select option:hover, select option:focus { background: var(--mint); color: var(--ink); outline: none; }
  select option::checkmark { position: absolute; inset-inline-end: 9px; top: 50%; transform: translateY(-50%); color: var(--teal); content: '\2713'; }
}
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; }
select:disabled, input:disabled, textarea:disabled { background-color: var(--disabled-bg); color: var(--disabled-ink); cursor: not-allowed; opacity: 1; }
textarea { resize: vertical; }
#departments { min-height: 224px; line-height: 1.4; }
input[type='checkbox'] { width: 19px; height: 19px; accent-color: var(--primary-bg); flex-shrink: 0; }
.check { display: flex; align-items: center; gap: 10px; font-weight: 500; line-height: 1.5; }
.pin-input { font-family: 'Space Grotesk', sans-serif; font-size: 36px; font-weight: 600; text-align: center; }
.btn { border: 1px solid transparent; border-radius: 5px; display: inline-flex; justify-content: center; align-items: center; gap: 9px; padding: 12px 18px; min-height: 46px; text-decoration: none; font-size: 14px; font-weight: 700; line-height: 1.35; }
.btn svg { width: 18px; height: 18px; }
.primary { background: var(--primary-bg); color: var(--on-primary); }
.primary:hover:not(:disabled) { background: var(--primary-hover); }
.secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.secondary:hover:not(:disabled) { border-color: var(--primary-bg); }
.danger { color: var(--red); border-color: var(--danger-border); background: transparent; }
form > .btn { margin: 24px 6px 0 0; }
#pin-form > .btn { width: 100%; }
.icon-btn { display: inline-grid; place-items: center; height: 42px; width: 42px; flex-shrink: 0; border-radius: 5px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.icon-btn:hover:not(:disabled) { background: var(--mint); }
.text-link { display: block; margin-top: 20px; font-size: 13px; }
.recent { margin-top: 28px; max-width: 400px; }

  .choice.selected { padding: 19px; }

  .choice-letter { width: 32px; height: 32px; font-size: 14px; }

  .button-group .btn { font-size: 12px; padding: 12px; }
  .votes { grid-template-columns: 1fr; }
  .publish-band { padding: 20px; flex-direction: column; align-items: stretch; }
  .tabs button { padding: 15px 12px; font-size: 12px; }
  .metric-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; gap: 16px; }
  .metric-strip > div { min-width: 0; }

  .personal-intro h1 { font-size: 38px; }
  .highlights { grid-template-columns: 1fr; gap: 24px; }

    <section class="similarity-detail" aria-live="polite"><div><h2>${html(selected.leftName)} × ${html(selected.rightName)}</h2><p>${selected.similarity} % podobnosť · ${selected.commonQuestionCount} ${plural(selected.commonQuestionCount, 'spoločná otázka', 'spoločné otázky', 'spoločných otázok')} · ${selected.leftPlayerCount} ${plural(selected.leftPlayerCount, 'človek', 'ľudia', 'ľudí')} a ${selected.rightPlayerCount} ${plural(selected.rightPlayerCount, 'človek', 'ľudia', 'ľudí')}</p></div><h3>Najväčšie rozdiely</h3><div class="similarity-differences">${differenceRows}</div></section>
    ${results.departments.some((department) => department.suppressed) ? '<p class="muted similarity-note">Oddelenia s malým počtom ľudí sú skryté.</p>' : ''}
    <p class="muted similarity-note">Skóre porovnáva rozdelenie odpovedí A na otázkach zodpovedaných v oboch oddeleniach. Nie je to percento ľudí s rovnakými odpoveďami.</p></section>`;
}

const tabs = [['overall', 'Profil odboru'], ['unanimous', 'Silná zhoda'], ['balanced', 'Tesné výsledky'], ['similarity', 'Podobnosť oddelení'], ['departments', 'Oddelenia'], ['questions', 'Otázky']];
const allowedTabs = new Set(tabs.map(([id]) => id));
const app = document.querySelector('#app');
const navigation = document.querySelector('#result-tabs');
const readParams = () => new URLSearchParams(location.hash.slice(1));
function navigate(changes) {
  const params = readParams();
  for (const [key, value] of Object.entries(changes)) params.set(key, value);
  location.hash = params.toString();
}
function render() {
  const params = readParams();
  const tab = allowedTabs.has(params.get('tab')) ? params.get('tab') : 'overall';
  navigation.innerHTML = tabs.map(([id, label]) => '<button type="button" data-tab="' + id + '" aria-current="' + (tab === id ? 'page' : 'false') + '">' + label + '</button>').join('');
  let content;
  if (tab === 'similarity') content = departmentSimilarityView();
  else if (tab === 'departments') {
    const department = results.departments.find(item => item.id === params.get('department')) || results.departments[0];
    content = '<label for="result-department">Oddelenie</label><select id="result-department">' + results.departments.map(item => '<option value="' + item.id + '" ' + (item.id === department.id ? 'selected' : '') + '>' + html(item.name) + ' (' + item.playerCount + ')</option>').join('') + '</select>' + profileView(department.profile, department.name, 'all', 'department');
  } else if (tab === 'questions') {
    const question = results.overall.rows.find(item => item.id === params.get('question')) || results.overall.rows[0];
    content = '<label for="result-question">Otázka</label><select id="result-question">' + results.overall.rows.map(item => '<option value="' + item.id + '" ' + (item.id === question.id ? 'selected' : '') + '>' + html(item.optionA) + ' / ' + html(item.optionB) + '</option>').join('') + '</select><section class="question-comparison"><h2>' + html(question.optionA) + ' / ' + html(question.optionB) + '</h2>' + voteRow(question) + results.departments.map(department => '<section><h3>' + html(department.name) + '</h3>' + voteRow(department.profile.rows.find(row => row.id === question.id)) + '</section>').join('') + '</section>';
  } else if (tab === 'unanimous' || tab === 'balanced') {
    const rows = tab === 'unanimous' ? results.overall.unanimous : results.overall.balanced;
    content = '<section class="profile-section focused-questions"><h2>' + (tab === 'unanimous' ? 'Silná zhoda' : 'Tesné výsledky') + '</h2><p class="focused-subtitle">' + (tab === 'unanimous' ? 'Kde máme jasný názor' : 'Kde sa názory delia') + '</p><div class="votes">' + rows.map(voteRow).join('') + '</div></section>';
  } else content = profileView({
    ...results.overall,
    rows: [...results.overall.rows].sort((left, right) => (right.dominance ?? -1) - (left.dominance ?? -1)),
    preferences: [],
  }, 'Profil nášho odboru');
  app.innerHTML = content;
}
navigation.addEventListener('click', event => { const button = event.target.closest('[data-tab]'); if (button) navigate({ tab: button.dataset.tab }); });
app.addEventListener('change', event => {
  if (event.target.id === 'result-department') navigate({ department: event.target.value });
  if (event.target.id === 'result-question') navigate({ question: event.target.value });
});
app.addEventListener('click', event => {
  const cell = event.target.closest('[data-similarity-left]');
  if (!cell) return;
  similarityPair = similarityKey(cell.dataset.similarityLeft, cell.dataset.similarityRight);
  const preview = document.createElement('template');
  preview.innerHTML = departmentSimilarityView();
  app.querySelector('.similarity-detail').replaceWith(preview.content.querySelector('.similarity-detail'));
  app.querySelectorAll('.similarity-cell').forEach(button => {
    button.setAttribute('aria-pressed', String(similarityKey(button.dataset.similarityLeft, button.dataset.similarityRight) === similarityPair));
  });
});
const system = matchMedia('(prefers-color-scheme: dark)');
let theme;
try { theme = localStorage.getItem('spoznaj-odbor-v2:theme'); } catch {}
function applyTheme() {
  const dark = (theme || (system.matches ? 'dark' : 'light')) === 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const label = dark ? 'Zapnúť svetlý režim' : 'Zapnúť tmavý režim';
  const toggle = document.querySelector('#theme-toggle');
  toggle.setAttribute('aria-label', label); toggle.title = label; toggle.innerHTML = icon(dark ? 'sun' : 'moon');
}
document.querySelector('#theme-toggle').addEventListener('click', () => {
  theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('spoznaj-odbor-v2:theme', theme); } catch {}
  applyTheme();
});
system.addEventListener('change', () => { if (!theme) applyTheme(); });
window.addEventListener('hashchange', render);
applyTheme(); render();
</script>
</body></html>
